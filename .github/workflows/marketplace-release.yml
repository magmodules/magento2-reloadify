name: Adobe Marketplace Release

# Submits a new version of an existing Marketplace package to both EQP reviews, technical and
# marketing. A package is only listed once it has passed both.
# - Module name comes from registration.php, SKU + version from composer.json (no per-module config).
# - Documentation artifacts and version compatibility are reused from the previous version, and
#   each marketing field (text, categories, prices, media) from the newest version that carries it,
#   so the very first version of a package must be submitted manually in the Developer Portal.
# - A field no earlier version carries makes the marketing review wait: the technical review is
#   still requested, the run warns, and the marketing side is finished in the Developer Portal.
# - A dry run reads EQP and logs the version list, where each marketing field comes from and the
#   prices it would send; it uploads and submits nothing.
# - Requires org secrets MARKETPLACE_APP_ID / MARKETPLACE_APP_SECRET (production) and
#   MARKETPLACE_SANDBOX_APP_ID / MARKETPLACE_SANDBOX_APP_SECRET (sandbox).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'EQP environment'
        type: choice
        options: [sandbox, production]
        default: sandbox
      dry_run:
        description: 'Only build and validate the zip (no upload/submit)'
        type: boolean
        default: true

jobs:
  marketplace-submit:
    runs-on: ubuntu-latest
    env:
      EQP_ENV: ${{ github.event_name == 'release' && 'production' || inputs.environment }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve module, SKU and version
        run: |
          MODULE_NAME=$(grep -oE "'[A-Za-z0-9]+_[A-Za-z0-9]+'" registration.php | head -1 | tr -d "'")
          SKU=$(jq -r '.name' composer.json)
          VERSION=$(jq -r '.version' composer.json)
          [ -n "$MODULE_NAME" ] || { echo "::error::Could not read module name from registration.php"; exit 1; }
          [ "$VERSION" != "null" ] || { echo "::error::No version in composer.json"; exit 1; }

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            [ "${TAG#v}" = "$VERSION" ] || { echo "::error::Release tag $TAG does not match composer.json version $VERSION"; exit 1; }
          fi

          if [ "$EQP_ENV" = "production" ]; then
            BASE_URL="https://commercedeveloper-api.adobe.com"
          else
            BASE_URL="https://commercedeveloper-sandbox-api.adobe.com"
          fi

          {
            echo "MODULE_NAME=$MODULE_NAME"
            echo "SKU=$SKU"
            echo "VERSION=$VERSION"
            echo "EQP_BASE_URL=$BASE_URL"
            echo "ZIP_NAME=MP-$MODULE_NAME-$VERSION.zip"
          } >> "$GITHUB_ENV"
          echo "Module: $MODULE_NAME | SKU: $SKU | Version: $VERSION | Env: $EQP_ENV | Dry run: $DRY_RUN"

      - name: Build zip
        run: |
          BUILD_DIR="$RUNNER_TEMP/package"
          mkdir -p "$BUILD_DIR"
          git archive --format=tar HEAD | tar -x -C "$BUILD_DIR"

          # Strip everything that must not ship to the Marketplace (on top of .gitattributes export-ignore)
          cd "$BUILD_DIR"
          rm -rf .github Test Tests test tests docs node_modules
          rm -f .gitignore .gitattributes .editorconfig \
                phpstan.neon phpstan.neon.dist phpcs.xml phpcs.xml.dist phpunit.xml phpunit.xml.dist \
                E2E-TESTS.md package.json package-lock.json playwright.config.ts
          zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .

      - name: Verify zip contents
        run: |
          LIST=$(unzip -Z1 "$ZIP_NAME")
          BAD=$(echo "$LIST" | grep -E '(^|/)\.|^(\.github|Test|Tests|test|tests|docs|node_modules)/|^(phpstan\.neon(\.dist)?|phpcs\.xml(\.dist)?|phpunit\.xml(\.dist)?|E2E-TESTS\.md|package(-lock)?\.json|playwright\.config\.ts)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Forbidden files in $ZIP_NAME:"
            echo "$BAD"
            exit 1
          fi
          for REQUIRED in composer.json registration.php etc/module.xml; do
            echo "$LIST" | grep -qx "$REQUIRED" || { echo "::error::$REQUIRED missing from zip root"; exit 1; }
          done
          echo "Zip OK: $(echo "$LIST" | grep -vc '/$') files"
          echo "$LIST" | awk -F/ '{print $1}' | sort | uniq -c

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Get EQP session token
        env:
          APP_ID: ${{ env.EQP_ENV == 'production' && secrets.MARKETPLACE_APP_ID || secrets.MARKETPLACE_SANDBOX_APP_ID }}
          APP_SECRET: ${{ env.EQP_ENV == 'production' && secrets.MARKETPLACE_APP_SECRET || secrets.MARKETPLACE_SANDBOX_APP_SECRET }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_SECRET" ] || { echo "::error::Marketplace API keys for $EQP_ENV are not configured"; exit 1; }
          RESPONSE=$(curl -sS --fail-with-body -X POST "$EQP_BASE_URL/rest/v1/app/session/token" \
            -u "$APP_ID:$APP_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{"grant_type":"session"}')
          UST=$(jq -r '.ust // empty' <<<"$RESPONSE")
          [ -n "$UST" ] || { echo "::error::No session token returned"; exit 1; }
          echo "::add-mask::$UST"
          echo "EQP_TOKEN=$UST" >> "$GITHUB_ENV"

      - name: Load previous version
        run: |
          ENCODED_SKU=$(jq -rn --arg s "$SKU" '$s|@uri')
          # This API pages at 20 records and returns the oldest first, so one call answers with the
          # oldest twenty versions of the sku and nothing else, which for a long-lived extension are
          # all versions already removed from the store. Reading only that page carries an old price
          # and old screenshots into today's release.
          PACKAGES='[]'
          OFFSET=0
          while :; do
            PAGE=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $EQP_TOKEN" \
              -G "$EQP_BASE_URL/rest/v1/products/packages/skus/$ENCODED_SKU" \
              --data-urlencode "offset=$OFFSET" --data-urlencode "limit=20" \
              | jq 'if type == "array" then . else [.] end')
            COUNT=$(jq 'length' <<<"$PAGE")
            [ "$COUNT" -gt 0 ] || break
            PACKAGES=$(jq -c -s 'add' <(echo "$PACKAGES") <(echo "$PAGE"))
            [ "$COUNT" -ge 20 ] || break
            OFFSET=$((OFFSET + COUNT))
            [ "$OFFSET" -lt 500 ] || { echo "::warning::$SKU has more than 500 versions, stopping"; break; }
          done
          # A page that ignores offset repeats itself; de-duplicate on version so a stuck page
          # cannot be mistaken for more versions.
          PACKAGES=$(jq -c 'unique_by(.version)' <<<"$PACKAGES")
          echo "Versions on EQP: $(jq 'length' <<<"$PACKAGES")"

          # A version that failed Adobe's review stays listed under the SKU. That one may be
          # submitted again (the submit step updates it in place); a version in review or
          # released may not.
          SAME=$(jq -c --arg v "$VERSION" '[.[] | select(.version == $v)] | sort_by(.created_at) | last // empty' <<<"$PACKAGES")
          if [ -n "$SAME" ]; then
            OVERALL=$(jq -r '.eqp_status.overall // "unknown"' <<<"$SAME")
            case "$OVERALL" in
              released|in_progress|submitted|queued)
                # A dry run submits nothing, so it keeps going and shows what it would have sent.
                if [ "$DRY_RUN" = "true" ]; then
                  echo "::warning::Version $VERSION of $SKU is already submitted (status: $OVERALL); a real run would stop here"
                else
                  echo "::error::Version $VERSION of $SKU is already submitted (status: $OVERALL)"
                  exit 1
                fi
                ;;
              *)
                echo "::warning::Version $VERSION of $SKU exists with status '$OVERALL'; it will be resubmitted"
                ;;
            esac
          fi

          LATEST=$(jq --arg v "$VERSION" '[.[] | select(.version != $v)] | sort_by(.created_at) | last' <<<"$PACKAGES")
          if [ "$LATEST" = "null" ]; then
            echo "::error::No previous version of $SKU found in $EQP_ENV; submit the first version manually in the Developer Portal"
            exit 1
          fi

          echo "Previous version: $(jq -r '.version' <<<"$LATEST")"
          # The package type is whatever the package already is on the Marketplace: "extension" for a
          # module, "shared" for a package other modules depend on. Hardcoding "extension"
          # submitted a shared package as a module.
          jq -r '.type // "extension"' <<<"$LATEST" > "$RUNNER_TEMP/type.txt"
          echo "Package type: $(cat "$RUNNER_TEMP/type.txt")"
          echo "Raw documentation_artifacts: $(jq -c '.documentation_artifacts' <<<"$LATEST")"
          echo "Raw version_compatibility: $(jq -c '.version_compatibility' <<<"$LATEST")"

          # Adobe rejects versions it no longer supports (e.g. "2.2"): keep 2.3+ and drop empty editions
          jq -c '(.version_compatibility // [])
            | map(.versions |= map(select((split(".") | map(tonumber)) >= [2, 3])))
            | map(select(.versions | length > 0))' <<<"$LATEST" > "$RUNNER_TEMP/compat.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/compat.json")" = "0" ]; then
            echo "::error::No supported Magento versions left in the previous version's compatibility"
            exit 1
          fi

          # documentation_artifacts values can be a single file object or an array of them
          # (the API returns arrays for some packages); keep only { file_upload_id } per type.
          jq -c '
            def pick: if type == "array" then (map(select(type == "object" and .file_upload_id != null)) | last)
                      elif type == "object" and .file_upload_id != null then .
                      else null end;
            (.documentation_artifacts // {})
            | if type == "array" then {} else . end
            | with_entries(.value |= pick | select(.value != null) | .value |= {file_upload_id})
          ' <<<"$LATEST" > "$RUNNER_TEMP/docs.json"

          if [ "$(jq 'length' "$RUNNER_TEMP/docs.json")" = "0" ]; then
            # A shared package carries no documentation on the Marketplace: user, installation
            # and reference are all empty. A module always has at least one PDF.
            if [ "$(cat "$RUNNER_TEMP/type.txt")" = "extension" ]; then
              echo "::error::Could not read documentation artifacts from the previous version (see raw output above)"
              exit 1
            fi
            echo "No documentation artifacts on the previous version; none are sent for a $(cat "$RUNNER_TEMP/type.txt")"
          fi
          echo "Documentation artifacts: $(cat "$RUNNER_TEMP/docs.json")"
          echo "Compatibility: $(cat "$RUNNER_TEMP/compat.json")"

          # EQP has two review pipelines and a package has to pass both to be listed. Asking for the
          # technical review alone leaves the marketing side in draft, where nobody at Adobe looks,
          # so the marketing fields and the media come along and both reviews are requested.
          #
          # Every field is taken from the newest version that carries it, a released version
          # outranking a draft, rather than the whole set from one version: the newest version that
          # still has media can be years old, and its price then rolls back whatever was edited in
          # the Developer Portal since. Media stays grouped, so a gallery is never half one version.
          #
          # media_artifacts is not shaped like documentation_artifacts: the icon is one file, the
          # gallery is a list of them and the video urls are plain strings. Treating it as a map of
          # single files drops the gallery and leaves an empty object behind.
          jq -c --arg v "$VERSION" '
            def media:
              (.media_artifacts // {}) as $m
              | {}
              + (if ($m.icon_image | type) == "object" and $m.icon_image.file_upload_id != null
                 then { icon_image: { file_upload_id: $m.icon_image.file_upload_id } } else {} end)
              + (if ($m.gallery_images | type) == "array"
                 then { gallery_images: [$m.gallery_images[]
                        | select(type == "object" and .file_upload_id != null) | { file_upload_id }] }
                 else {} end)
              + (if ($m.video_urls | type) == "array" and ($m.video_urls | length) > 0
                 then { video_urls: $m.video_urls } else {} end)
              | with_entries(select(.value != null and (.value | if type == "array" then length > 0 else true end)));
            def fields: ({ name, long_description, short_description, categories, license_type,
                           custom_license_name, custom_license_url, pricing_model, prices,
                           support_tiers, stability }
                         | with_entries(select(.value != null and .value != "" and .value != [])));
            [.[] | select(.version != $v)]
            | sort_by(.eqp_status.overall == "released_to_store", .created_at)
            | reduce .[] as $p ({};
                . + ($p | fields | with_entries(.value |= { value: ., from: $p.version }))
                  + (($p | media) as $m
                     | if ($m | length) > 0 then { media_artifacts: { value: $m, from: $p.version } } else {} end))
          ' <<<"$PACKAGES" > "$RUNNER_TEMP/source.json"

          jq -c 'del(.media_artifacts) | with_entries(.value |= .value)' "$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/marketing.json"
          jq -c '.media_artifacts.value // {}' "$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/media.json"
          echo "Marketing fields per source version: $(jq -r '[to_entries[] | "\(.key)=\(.value.from)"] | join(" ")' "$RUNNER_TEMP/source.json")"
          echo "Media artifacts: $(cat "$RUNNER_TEMP/media.json")"
          echo "Prices: $(jq -c '.prices' "$RUNNER_TEMP/marketing.json")"

          # Without these the marketing pipeline refuses the submission, and a half-submitted
          # package is worse than one that is only waiting on the technical review: it reads as
          # submitted while nothing is moving.
          MARKETING_READY=1
          for FIELD in name long_description categories license_type; do
            jq -e --arg f "$FIELD" 'has($f)' "$RUNNER_TEMP/marketing.json" >/dev/null \
              || { echo "::warning::No earlier version of $SKU carries $FIELD; marketing review will not be requested"; MARKETING_READY=0; }
          done
          jq -e '.icon_image.file_upload_id != null' "$RUNNER_TEMP/media.json" >/dev/null \
            || { echo "::warning::No earlier version of $SKU carries an icon image; marketing review will not be requested"; MARKETING_READY=0; }
          jq -e '(.gallery_images // []) | length > 0' "$RUNNER_TEMP/media.json" >/dev/null \
            || { echo "::warning::No earlier version of $SKU carries gallery images; marketing review will not be requested"; MARKETING_READY=0; }
          echo "MARKETING_READY=$MARKETING_READY" >> "$GITHUB_ENV"

      - name: Upload zip to EQP
        if: env.DRY_RUN != 'true'
        run: |
          RESPONSE=$(curl -sS --fail-with-body -X POST "$EQP_BASE_URL/rest/v1/files/uploads" \
            -H "Authorization: Bearer $EQP_TOKEN" \
            -F "file[]=@$ZIP_NAME;type=application/zip")
          FILE_UPLOAD_ID=$(jq -r '.[0].file_upload_id // empty' <<<"$RESPONSE")
          [ -n "$FILE_UPLOAD_ID" ] || { echo "::error::Upload failed: $RESPONSE"; exit 1; }
          echo "FILE_UPLOAD_ID=$FILE_UPLOAD_ID" >> "$GITHUB_ENV"
          echo "Upload ID: $FILE_UPLOAD_ID"

          # Packages are only accepted once the malware scan has passed
          for i in $(seq 1 30); do
            STATUS=$(curl -sS --fail-with-body -H "Authorization: Bearer $EQP_TOKEN" \
              "$EQP_BASE_URL/rest/v1/files/uploads/$FILE_UPLOAD_ID" \
              | jq -r 'if type == "array" then .[0] else . end | .malware_status')
            echo "Malware scan: $STATUS"
            # Docs say pass/fail, the API actually returns passed/failed
            case "$STATUS" in
              pass|passed) exit 0 ;;
              fail|failed) echo "::error::Malware scan failed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Malware scan did not finish in time"
          exit 1

      - name: Submit package
        if: env.DRY_RUN != 'true'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          NOTES="$RELEASE_BODY"
          if [ -z "$NOTES" ]; then
            NOTES=$(awk -v v="## [$VERSION]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          fi
          # Strip bold markers and the Compatibility / Minimum requirements block (Marketplace shows that itself)
          NOTES=$(printf '%s\n' "$NOTES" \
            | sed 's/\r$//; s/\*\*//g' \
            | awk '/^(Compatibility|Minimum requirements):[[:space:]]*$/ {skip=1; next}
                   skip && /^([*-] |[[:space:]]*$)/ {next}
                   {skip=0; print}' \
            | sed '/[^[:space:]]/,$!d' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')
          [ -n "$NOTES" ] || { echo "::error::No release notes (release body empty and no CHANGELOG.md section for $VERSION)"; exit 1; }

          PACKAGE_TYPE=$(cat "$RUNNER_TEMP/type.txt" 2>/dev/null || echo extension)
          PAYLOAD=$(jq -n \
            --arg sku "$SKU" \
            --arg type "$PACKAGE_TYPE" \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg file_id "$FILE_UPLOAD_ID" \
            --slurpfile compat "$RUNNER_TEMP/compat.json" \
            --slurpfile docs "$RUNNER_TEMP/docs.json" \
            --slurpfile marketing "$RUNNER_TEMP/marketing.json" \
            --slurpfile media "$RUNNER_TEMP/media.json" \
            --argjson ready "${MARKETING_READY:-0}" \
            '[{
              action: (if $ready == 1 then { technical: "submit", marketing: "submit" }
                       else { technical: "submit" } end),
              type: $type,
              platform: "M2",
              sku: $sku,
              version: $version,
              release_notes: $notes,
              artifact: { file_upload_id: $file_id },
              version_compatibility: $compat[0]
            } + (if ($docs[0] | length) > 0 then {documentation_artifacts: $docs[0]} else {} end)
              + (if $ready == 1 then $marketing[0] + { media_artifacts: $media[0] } else {} end)]')

          # A failed earlier attempt can leave this version behind (e.g. as a draft): update that
          # submission instead of creating a duplicate. The API's sku/version filters are substring
          # matches, so match exactly here.
          EXISTING=$(curl -sS --fail-with-body -G "$EQP_BASE_URL/rest/v1/products/packages" \
            -H "Authorization: Bearer $EQP_TOKEN" \
            --data-urlencode "sku=$SKU" \
            --data-urlencode "version=$VERSION" \
            | jq -c --arg sku "$SKU" --arg v "$VERSION" \
              '[(if type == "array" then . else [.] end)[] | select(.sku == $sku and .version == $v)]
               | sort_by(.created_at) | last // empty')
          METHOD=POST
          if [ -n "$EXISTING" ]; then
            EXISTING_ID=$(jq -r '.submission_id' <<<"$EXISTING")
            echo "Version $VERSION already exists as submission $EXISTING_ID, status: $(jq -c '.eqp_status' <<<"$EXISTING")"
            echo "Updating and resubmitting it"
            METHOD=PUT
            PAYLOAD=$(jq --arg sid "$EXISTING_ID" 'map(. + {submission_id: $sid})' <<<"$PAYLOAD")
          fi

          RESPONSE=$(curl -sS --fail-with-body -X "$METHOD" "$EQP_BASE_URL/rest/v1/products/packages" \
            -H "Authorization: Bearer $EQP_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          CODE=$(jq -r '.[0].code' <<<"$RESPONSE")
          if [ "$CODE" != "200" ]; then
            echo "::error::Submission failed: $(jq -r '.[0].message' <<<"$RESPONSE")"
            echo "$RESPONSE"
            exit 1
          fi
          echo "SUBMISSION_ID=$(jq -r '.[0].submission_id' <<<"$RESPONSE")" >> "$GITHUB_ENV"
          echo "EQP_STATUS=$(jq -r '.[0].eqp_status.overall // "submitted"' <<<"$RESPONSE")" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Adobe Marketplace Submission"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Module | \`$MODULE_NAME\` |"
            echo "| SKU | \`$SKU\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Environment | \`$EQP_ENV\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Zip | \`$ZIP_NAME\` |"
            echo "| Submission ID | \`${SUBMISSION_ID:-n/a}\` |"
            echo "| EQP Status | \`${EQP_STATUS:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
